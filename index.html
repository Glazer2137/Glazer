<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glazer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.22) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .logo {
      font-size: 4.8rem;
      font-weight: 800;
      letter-spacing: 10px;
      background: linear-gradient(135deg, #c084fc, #8b5cf6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
      z-index: 1;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #a1a1aa;
      margin-bottom: 40px;
      z-index: 1;
      letter-spacing: 1px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
      z-index: 1;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.6);
    }

    .socials {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .socials a {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: white;
      transition: all 0.25s ease;
      font-size: 13px;
      font-weight: 700;
    }

    .socials a:hover {
      background: #8b5cf6;
      border-color: #8b5cf6;
      transform: scale(1.1);
    }

    .socials a svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .socials a.money {
      background: #7c3aed;
      border-color: #7c3aed;
    }

    @media (max-width: 600px) {
      .logo { font-size: 3rem; letter-spacing: 4px; }
      .socials { right: 12px; gap: 10px; }
      .socials a { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>
  <h1 class="logo">GLAZER</h1>
  <p class="subtitle">Everything you need in One Place.</p>

  <a href="https://www.instagram.com/glazer__2137/" target="_blank" class="btn">
    Instagram
  </a>

  <div class="socials">
    <a href="https://www.tiktok.com/@glazerusfans" target="_blank" title="TikTok">

    </a>
    <a href="https://usfans.com/register?ref=U3CDZW" target="_blank" class="money" title="$30">
      $30

</body>
</html>
