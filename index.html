<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glazer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
      position: relative;
    }

    /* tło z gradientem */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .logo {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #c084fc, #8b5cf6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(139, 92, 246, 0.4);
      margin-bottom: 16px;
      z-index: 1;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #a1a1aa;
      margin-bottom: 40px;
      z-index: 1;
      letter-spacing: 1px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
      z-index: 1;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.6);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 3rem;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>
  <h1 class="logo">GLAZER</h1>
  <p class="subtitle">Everything you need in One Place.</p>
  
  <a href="https://www.instagram.com/glazer__2137/" target="_blank" class="btn">
